# Highest changed-file tier wins; sensitive wins overlaps and unmatched paths
# default to sensitive. ** matches zero or more directories. Consumers must
# reject duplicate YAML keys and preserve this fail-closed matching contract.
#
# Content always escalates to sensitive regardless of path: new or changed
# public endpoints or input parsing; auth/authz/session; crypto/keys; secrets
# or credentials; permission checks; tenant isolation or personal data;
# SQL/schema/migrations; dependencies or lockfiles, including dev dependencies;
# CI/workflows; weakened assertions, deleted tests/snapshots or lowered test
# gates. Low test globs, if added later, are additive-only and never exempt
# test weakening from escalation.
#
# Every change gets QA. Sensitive, unclassified, content-triggered or
# QA-escalated changes get Security followed by QA. The map itself is sensitive.
version: 1
default_tier: sensitive

tiers:
  # LICENSE is static legal text. README and docs describe credentials,
  # security, packaging and cutover and therefore remain sensitive.
  low:
    - "LICENSE"
  # No runtime module has been audited as free of input, sensitive output,
  # permissions, persistence and trust-boundary effects.
  ordinary: []
  sensitive:
    - ".github/**"
    - "CODEOWNERS"
    - "**/CODEOWNERS"
    - "AGENTS.md"
    - "**/AGENTS.md"
    - ".claude/**"
    - "**/.claude/**"
    - "skills/**"
    - "**/skills/**"
    - "go.mod"
    - "go.sum"
    - "**/go.mod"
    - "**/go.sum"
    - "Makefile"
    - "**/Makefile"
    - "Dockerfile"
    - "**/Dockerfile*"
    - "scripts/**"
    - "integration/**"
    # Provider implementation and tests touch auth, network, parsing, quota,
    # host compatibility and release contracts; no test is downgraded.
    - "*.go"
    - "**/*.go"
    - "registry.json"
    - "README.md"
    - "docs/**"
