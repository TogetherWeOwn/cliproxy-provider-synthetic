name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            go.sum
            integration/hostcompat/go.sum
      - name: Build prerequisites
        run: sudo apt-get update && sudo apt-get install -y gcc binutils zip
      - name: Isolated scratch directory
        run: |
          mkdir -p "$HOME/.cache"
          echo "TMPDIR=$(mktemp -d "$HOME/.cache/synthetic-ci.XXXXXX")" >> "$GITHUB_ENV"
      - name: Formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go') $(git ls-files --others --exclude-standard '*.go'))"
      - name: Vet
        run: |
          go vet ./...
          go -C integration/hostcompat vet ./...
      - name: Race tests and release packaging contract
        run: go test -race -count=1 ./...
      - name: Real v8.0.49 host loader compatibility
        run: go -C integration/hostcompat test -race -count=1 ./...
      - name: Production C shared library
        run: |
          go build -trimpath -buildmode=c-shared -o "$TMPDIR/synthetic.so" .
          nm -D "$TMPDIR/synthetic.so" > "$TMPDIR/symbols.txt"
          grep -q ' T cliproxy_plugin_init$' "$TMPDIR/symbols.txt"
      - name: Secret scan
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          gitleaks dir --redact --no-banner .
          python3 -I scripts/check-public-files.py .
      - name: Remove scratch directory
        if: always()
        run: |
          if [[ -n "${TMPDIR:-}" && "$TMPDIR" == "$HOME/.cache/synthetic-ci."* ]]; then rm -rf -- "$TMPDIR"; fi
